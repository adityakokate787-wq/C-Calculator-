
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      font-family: Arial, sans-serif;
      color: white;
    }

    .calculator {
      width: 340px;
      padding: 22px;
      background: #1e293b;
      border-radius: 22px;
      box-shadow: 0 15px 40px #0008;
    }

    h2 {
      text-align: center;
      margin: 0 0 18px;
      letter-spacing: 1px;
    }

    #display {
      width: 100%;
      height: 75px;
      margin-bottom: 18px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      text-align: right;
      font-size: 30px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 12px;
      background: #334155;
      color: white;
      font-size: 21px;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #475569;
    }

    .operator {
      background: #2563eb;
    }

    .operator:hover {
      background: #1d4ed8;
    }

    .action {
      background: #b45309;
    }

    .action:hover {
      background: #92400e;
    }

    .equal {
      background: #16a34a;
      grid-column: span 2;
    }

    .equal:hover {
      background: #15803d;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h2>C CALCULATOR</h2>

    <input type="text" id="display"
           placeholder="0" readonly>

    <div class="buttons">
      <button class="action" onclick="clearDisplay()">AC</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="add('%')">%</button>
      <button class="operator" onclick="add('/')">÷</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="operator" onclick="add('*')">×</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="operator" onclick="add('-')">−</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="operator" onclick="add('+')">+</button>

      <button class="zero" onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function add(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = "";
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        const expression = display.value;

        if (!expression ||
            !/^[0-9+\-*/%.() ]+$/.test(expression)) {
          throw new Error();
        }

        const result = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
          throw new Error();
        }

        display.value = Number(result.toPrecision(12));
      } catch {
        display.value = "Error";
      }
    }
  </script>

</body>
</html>
